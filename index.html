<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    color-scheme:light;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body{margin:0;font:14px system-ui,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>N4 단어 트레이너</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Layout: single column study card, max 600px, sticky top bar, screens swapped with [hidden] */
  :root{
    --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#EDF0F7;
    --fg:#161A22; --muted:#5C6478; --line:#DDE2ED;
    --accent:#2E4FA3; --accent-soft:#E7ECF9; --accent-fg:#FFFFFF;
    --ok:#1C7A58; --ok-soft:#E0F2EA; --ng:#A8323F; --ng-soft:#FAE6E8;
    --font-jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    --font-kr:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
    --r:14px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#10131A; --surface:#191D27; --surface-2:#222736;
      --fg:#EBEFF7; --muted:#99A2B8; --line:#2B3140;
      --accent:#90A9EC; --accent-soft:#1D2537; --accent-fg:#0F131C;
      --ok:#5ECCA2; --ok-soft:#14291F; --ng:#F08A95; --ng-soft:#2D1A1E;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#10131A; --surface:#191D27; --surface-2:#222736;
    --fg:#EBEFF7; --muted:#99A2B8; --line:#2B3140;
    --accent:#90A9EC; --accent-soft:#1D2537; --accent-fg:#0F131C;
    --ok:#5ECCA2; --ok-soft:#14291F; --ng:#F08A95; --ng-soft:#2D1A1E;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-jp);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .kr{font-family:var(--font-kr)}
  .wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
  header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
  .brand{display:flex;align-items:baseline;gap:8px;font-weight:900;letter-spacing:.02em}
  .brand .lv{background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:1px 8px;font-size:13px;letter-spacing:.06em}
  .brand .nm{font-size:15px}
  .bar-sp{flex:1}
  .ghost{appearance:none;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;font-family:var(--font-kr)}
  .ghost:hover{color:var(--fg);border-color:var(--accent)}
  h1{font-size:26px;line-height:1.35;margin:28px 0 6px;text-wrap:balance;font-family:var(--font-kr);font-weight:700}
  .lead{color:var(--muted);font-size:14px;margin:0 0 22px;font-family:var(--font-kr)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
  .stat b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
  .stat span{font-size:12px;color:var(--muted);font-family:var(--font-kr)}
  .stat.ok b{color:var(--ok)} .stat.ng b{color:var(--ng)}
  fieldset{border:0;margin:0 0 20px;padding:0}
  legend{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:9px;font-family:var(--font-kr)}
  .opts{display:grid;gap:8px}
  .opts.row{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
  .opt{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-width:0}
  .opt:hover{border-color:var(--accent)}
  .opt input{margin:4px 0 0;accent-color:var(--accent);flex:none}
  .opt .t{font-weight:700;font-size:15px;font-family:var(--font-kr);min-width:0}
  .opt .d{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
  .opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .opt.compact{padding:9px 12px;justify-content:center;text-align:center}
  .opt.compact .t{font-size:14px}
  button.primary{appearance:none;width:100%;background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:15px 20px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;font-family:var(--font-kr)}
  button.primary:hover{filter:brightness(1.08)}
  button.primary:disabled{opacity:.45;cursor:not-allowed}
  button.sec{appearance:none;width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:13px 20px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;font-family:var(--font-kr)}
  button.sec:hover{border-color:var(--accent)}
  .note{font-size:12.5px;color:var(--muted);margin-top:10px;font-family:var(--font-kr)}
  /* quiz */
  .prog{display:flex;align-items:center;gap:12px;margin:18px 0 14px}
  .prog .track{flex:1;height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden}
  .prog .fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
  .prog .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
  .qcard{padding:26px 20px;text-align:center}
  .qtag{display:inline-block;font-size:11px;letter-spacing:.09em;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:3px 11px;margin-bottom:16px;font-family:var(--font-kr)}
  .qread{font-size:14px;color:var(--muted);letter-spacing:.06em;min-height:22px}
  .qword{font-size:40px;font-weight:900;letter-spacing:.02em;line-height:1.25;margin:2px 0 4px;word-break:break-word}
  .qword.kr{font-size:30px}
  .qsub{font-size:12.5px;color:var(--muted);font-family:var(--font-kr)}
  .choices{display:grid;gap:9px;margin-top:18px}
  .choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:inherit;font-size:17px;font-weight:500;color:var(--fg);cursor:pointer;min-width:0}
  .choice .key{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:700;display:grid;place-items:center}
  .choice .txt{min-width:0;word-break:break-word}
  .choice:hover:not(:disabled){border-color:var(--accent)}
  .choice:disabled{cursor:default}
  .choice.correct{border-color:var(--ok);background:var(--ok-soft)}
  .choice.correct .key{background:var(--ok);color:var(--surface)}
  .choice.wrong{border-color:var(--ng);background:var(--ng-soft)}
  .choice.wrong .key{background:var(--ng);color:var(--surface)}
  .choice.dim{opacity:.45}
  .inputrow{display:flex;gap:8px;margin-top:18px}
  .inputrow input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:inherit;font-size:20px;color:var(--fg);text-align:center;letter-spacing:.08em}
  .inputrow input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .inputrow button{flex:none;width:96px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:700;cursor:pointer;font-family:var(--font-kr)}
  .verdict{margin-top:14px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface)}
  .verdict.is-ok{border-color:var(--ok);background:var(--ok-soft)}
  .verdict.is-ng{border-color:var(--ng);background:var(--ng-soft)}
  .verdict .head{font-weight:900;font-size:14px;font-family:var(--font-kr);margin-bottom:6px}
  .verdict.is-ok .head{color:var(--ok)} .verdict.is-ng .head{color:var(--ng)}
  .vline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
  .vline .vw{font-size:21px;font-weight:700}
  .vline .vr{font-size:13px;color:var(--muted)}
  .vline .vk{font-size:15px;font-family:var(--font-kr);width:100%}
  .pos{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
  .acts{margin-top:14px}
  .hint{text-align:center;font-size:12px;color:var(--muted);margin-top:10px;font-family:var(--font-kr)}
  /* result */
  .score{text-align:center;padding:30px 20px}
  .score .big{font-size:52px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
  .score .of{font-size:20px;color:var(--muted);font-weight:700}
  .score .pct{font-size:14px;color:var(--muted);margin-top:6px;font-family:var(--font-kr)}
  .reviewhead{font-size:13px;font-weight:700;color:var(--ng);margin:24px 0 10px;font-family:var(--font-kr)}
  .rlist{display:grid;gap:8px}
  .ritem{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ng);border-radius:10px;padding:11px 14px}
  .ritem .w{font-size:18px;font-weight:700}
  .ritem .r{font-size:12.5px;color:var(--muted)}
  .ritem .k{font-size:14px;font-family:var(--font-kr);width:100%;color:var(--muted)}
  .btnrow{display:grid;gap:9px;margin-top:22px}
  /* list */
  .search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 15px;font:inherit;font-size:15px;color:var(--fg);margin-bottom:10px}
  .search:focus{outline:2px solid var(--accent);outline-offset:1px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .chip{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 13px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
  .wlist{display:grid;gap:7px}
  .wrow{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
  .wrow .main{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;min-width:0}
  .wrow .w{font-size:17px;font-weight:700}
  .wrow .r{font-size:12.5px;color:var(--muted)}
  .wrow .k{grid-column:1/-1;font-size:14px;font-family:var(--font-kr);color:var(--muted);min-width:0}
  .dot{flex:none;width:8px;height:8px;border-radius:99px;background:var(--line);align-self:center}
  .dot.learned{background:var(--ok)} .dot.weak{background:var(--ng)}
  .count{font-size:12.5px;color:var(--muted);margin-bottom:12px;font-family:var(--font-kr)}
  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-family:var(--font-kr)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand"><span class="lv">N4</span><span class="nm kr">단어 트레이너</span></div>
    <div class="bar-sp"></div>
    <button class="ghost" id="navList" type="button">단어장</button>
    <button class="ghost" id="navHome" type="button" hidden>홈</button>
  </div>
</header>

<div class="wrap">

  <!-- HOME -->
  <section id="home">
    <h1>오늘은 몇 개 외워 볼까요?</h1>
    <p class="lead">JLPT N4 시험 범위 <b id="totalWords">0</b>단어 (N4 <b id="cnt4">0</b> · N5 <b id="cnt5">0</b>) · 뜻은 한국어로 표시됩니다.</p>

    <div class="stats">
      <div class="stat ok"><b id="stLearned">0</b><span>외운 단어</span></div>
      <div class="stat ng"><b id="stWeak">0</b><span>약한 단어</span></div>
      <div class="stat"><b id="stSeen">0</b><span>학습한 단어</span></div>
    </div>

    <fieldset>
      <legend>출제 형식</legend>
      <div class="opts" id="modeOpts">
        <label class="opt"><input type="radio" name="mode" value="jp2kr" checked><span class="t">일본어 → 뜻<span class="d">静か → 조용함 (4지선다)</span></span></label>
        <label class="opt"><input type="radio" name="mode" value="kr2jp"><span class="t">뜻 → 일본어<span class="d">조용함 → 静か (4지선다)</span></span></label>
        <label class="opt"><input type="radio" name="mode" value="reading"><span class="t">한자 읽기<span class="d">静か → しずか (선택 또는 입력)</span></span></label>
        <label class="opt"><input type="radio" name="mode" value="mixed"><span class="t">섞어서<span class="d">위 세 가지를 무작위로</span></span></label>
      </div>
      <label class="opt" id="typeWrap" style="margin-top:8px" hidden><input type="checkbox" id="typeMode"><span class="t">읽기는 직접 입력으로 답하기<span class="d">히라가나로 입력합니다. 일본어 키보드가 없으면 끄세요.</span></span></label>
    </fieldset>

    <fieldset>
      <legend>레벨</legend>
      <div class="opts row">
        <label class="opt compact"><input type="radio" name="lv" value="all" checked><span class="t">전체</span></label>
        <label class="opt compact"><input type="radio" name="lv" value="4"><span class="t">N4 단어</span></label>
        <label class="opt compact"><input type="radio" name="lv" value="5"><span class="t">N5 기초</span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>품사</legend>
      <div class="opts row" id="posOpts"></div>
    </fieldset>

    <fieldset>
      <legend>문항 수</legend>
      <div class="opts row">
        <label class="opt compact"><input type="radio" name="count" value="10" checked><span class="t">10문제</span></label>
        <label class="opt compact"><input type="radio" name="count" value="20"><span class="t">20문제</span></label>
        <label class="opt compact"><input type="radio" name="count" value="30"><span class="t">30문제</span></label>
        <label class="opt compact"><input type="radio" name="count" value="0"><span class="t">전부</span></label>
      </div>
      <label class="opt" id="weakWrap" style="margin-top:8px"><input type="checkbox" id="weakOnly"><span class="t">약한 단어만 출제<span class="d" id="weakDesc">틀린 적이 있고 아직 다시 맞히지 못한 단어</span></span></label>
    </fieldset>

    <button class="primary" id="startBtn" type="button">시작하기</button>
    <p class="note" id="poolNote"></p>
  </section>

  <!-- QUIZ -->
  <section id="quiz" hidden>
    <div class="prog"><span class="n" id="qn">1 / 10</span><span class="track"><span class="fill" id="qfill"></span></span><span class="n" id="qscore">0</span></div>
    <div class="card qcard">
      <span class="qtag" id="qtag">일본어 → 뜻</span>
      <div class="qread" id="qread"></div>
      <div class="qword" id="qword"></div>
      <div class="qsub" id="qsub"></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="inputrow" id="inputrow" hidden>
      <input id="answerInput" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ひらがな" aria-label="읽기를 히라가나로 입력">
      <button type="button" id="checkBtn">확인</button>
    </div>
    <div class="verdict" id="verdict" hidden>
      <div class="head" id="vhead"></div>
      <div class="vline"><span class="vw" id="vw"></span><span class="vr" id="vr"></span><span class="pos" id="vp"></span><span class="vk kr" id="vk"></span></div>
    </div>
    <div class="acts" id="acts" hidden><button class="primary" id="nextBtn" type="button">다음</button></div>
    <p class="hint" id="qhint">숫자 키 1–4로도 답할 수 있어요</p>
    <div class="btnrow"><button class="sec" id="quitBtn" type="button">그만두고 홈으로</button></div>
  </section>

  <!-- RESULT -->
  <section id="result" hidden>
    <div class="card score">
      <div><span class="big" id="rsScore">0</span><span class="of" id="rsOf"> / 10</span></div>
      <div class="pct" id="rsPct"></div>
    </div>
    <div id="reviewBox" hidden>
      <div class="reviewhead" id="reviewHead">틀린 단어</div>
      <div class="rlist" id="rlist"></div>
    </div>
    <div class="btnrow">
      <button class="primary" id="againWrong" type="button" hidden>틀린 단어만 다시 풀기</button>
      <button class="sec" id="againSame" type="button">같은 설정으로 한 번 더</button>
      <button class="sec" id="toHome" type="button">홈으로</button>
    </div>
  </section>

  <!-- LIST -->
  <section id="list" hidden>
    <h1>단어장</h1>
    <input class="search" id="search" type="search" placeholder="일본어 · 읽기 · 한국어로 검색" aria-label="단어 검색">
    <div class="chips" id="listChips"></div>
    <p class="count" id="listCount"></p>
    <div class="wlist" id="wlist"></div>
  </section>

  <footer>
    학습 기록은 이 브라우저에만 저장됩니다. · <button class="ghost" id="resetBtn" type="button">기록 지우기</button>
  </footer>
</div>

<script>
/* [word, reading, Korean meaning, part of speech] — JLPT N4 core vocabulary */
const RAW = [
["急ぐ","いそぐ","서두르다","v","4"],["遅れる","おくれる","늦다","v","4"],["間に合う","まにあう","시간에 맞추다","v","4"],
["続ける","つづける","계속하다","v","4"],["続く","つづく","계속되다","v","4"],["始める","はじめる","시작하다","v","5"],
["始まる","はじまる","시작되다","v","5"],["終わる","おわる","끝나다","v","5"],["決める","きめる","정하다, 결정하다","v","4"],
["決まる","きまる","정해지다","v","4"],["調べる","しらべる","조사하다, 알아보다","v","4"],["選ぶ","えらぶ","고르다, 선택하다","v","4"],
["比べる","くらべる","비교하다","v","4"],["集める","あつめる","모으다","v","4"],["集まる","あつまる","모이다","v","4"],
["運ぶ","はこぶ","나르다, 옮기다","v","4"],["届ける","とどける","배달하다, 전해 주다","v","4"],["払う","はらう","지불하다, (돈을) 내다","v","4"],
["返す","かえす","돌려주다","v","4"],["借りる","かりる","빌리다","v","5"],["貸す","かす","빌려주다","v","5"],
["探す","さがす","찾다","v","4"],["見つける","みつける","찾아내다, 발견하다","v","4"],["伝える","つたえる","전하다","v","4"],
["教える","おしえる","가르치다","v","5"],["習う","ならう","배우다","v","5"],["覚える","おぼえる","외우다, 기억하다","v","4"],
["忘れる","わすれる","잊다","v","5"],["考える","かんがえる","생각하다","v","4"],["思い出す","おもいだす","생각해 내다, 떠올리다","v","4"],

const POS_LABEL = {v:"동사", i:"い형용사", na:"な형용사", n:"명사", adv:"부사·기타"};
const POS_JP = {v:"動詞", i:"い形容詞", na:"な形容詞", n:"名詞", adv:"副詞・その他"};
const MODE_LABEL = {jp2kr:"일본어 → 뜻", kr2jp:"뜻 → 일본어", reading:"한자 읽기"};
const KANJI = /[一-龯々]/;

const WORDS = RAW.concat(RAW2).map(function(a){
  return {w:a[0], r:a[1], k:a[2], p:a[3], lv:a[4] || "4", id:a[0]+"|"+a[1], kanji:KANJI.test(a[0])};
});
const KANJI_WORDS = WORDS.filter(function(x){return x.kanji;});

/* ---------- storage ---------- */
const KEY = "n4-vocab-trainer-v1";
let stats = {};
function loadStats(){
  try{ stats = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; }catch(e){ stats = {}; }
}
function saveStats(){
  try{ localStorage.setItem(KEY, JSON.stringify(stats)); }catch(e){}
}
function record(word, ok){
  const s = stats[word.id] || {o:0, x:0, s:0};
  if(ok){ s.o++; s.s++; } else { s.x++; s.s = 0; }
  stats[word.id] = s;
  saveStats();
}
function isLearned(word){ const s = stats[word.id]; return !!s && s.s >= 2; }
function isWeak(word){ const s = stats[word.id]; return !!s && s.x > 0 && s.s < 1; }
function isSeen(word){ return !!stats[word.id]; }

/* ---------- helpers ---------- */
const $ = function(id){ return document.getElementById(id); };
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function toHiragana(s){
  return (s || "").trim().replace(/\s+/g, "").replace(/[ァ-ヶ]/g, function(c){
    return String.fromCharCode(c.charCodeAt(0) - 0x60);
  });
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}

/* ---------- question building ---------- */
function pickDistractors(answer, mode, n){
  let pool;
  if(mode === "reading"){
    pool = KANJI_WORDS.filter(function(x){
      return x.id !== answer.id && x.r !== answer.r && Math.abs(x.r.length - answer.r.length) <= 1;
    });
    if(pool.length < n){
      pool = KANJI_WORDS.filter(function(x){ return x.id !== answer.id && x.r !== answer.r; });
    }
  } else {
    pool = WORDS.filter(function(x){
      return x.id !== answer.id && x.p === answer.p && x.k !== answer.k && x.w !== answer.w;
    });
    if(pool.length < n){
      pool = WORDS.filter(function(x){ return x.id !== answer.id && x.k !== answer.k && x.w !== answer.w; });
    }
  }
  return shuffle(pool).slice(0, n);
}
function textFor(word, mode){
  return mode === "jp2kr" ? word.k : (mode === "kr2jp" ? word.w : word.r);
}
function makeQuestion(word, mode, typed){
  const m = (mode === "reading" && !word.kanji) ? "jp2kr" : mode;
  if(m === "reading" && typed) return {word:word, mode:m, type:"input"};
  const others = pickDistractors(word, m, 3);
  const all = shuffle([word].concat(others));
  return {
    word: word,
    mode: m,
    type: "choice",
    choices: all.map(function(x){ return textFor(x, m); }),
    answer: all.indexOf(word)
  };
}

/* ---------- state ---------- */
let session = null;
let settings = {mode:"jp2kr", pos:"all", lv:"all", count:10, weak:false, typed:false};

function currentPool(){
  let pool = WORDS;
  if(settings.pos !== "all") pool = pool.filter(function(x){ return x.p === settings.pos; });
  if(settings.lv !== "all") pool = pool.filter(function(x){ return x.lv === settings.lv; });
  if(settings.mode === "reading") pool = pool.filter(function(x){ return x.kanji; });
  if(settings.weak) pool = pool.filter(isWeak);
  return pool;
}
function readSettings(){
  settings.mode = document.querySelector('input[name="mode"]:checked').value;
  settings.count = parseInt(document.querySelector('input[name="count"]:checked').value, 10);
  const posEl = document.querySelector('input[name="pos"]:checked');
  settings.pos = posEl ? posEl.value : "all";
  const lvEl = document.querySelector('input[name="lv"]:checked');
  settings.lv = lvEl ? lvEl.value : "all";
  settings.weak = $("weakOnly").checked;
  settings.typed = $("typeMode").checked;
}

/* ---------- screens ---------- */
function show(name){
  ["home","quiz","result","list"].forEach(function(id){ $(id).hidden = (id !== name); });
  $("navList").hidden = (name === "list");
  $("navHome").hidden = (name !== "list");
  window.scrollTo(0, 0);
}

/* ---------- home ---------- */
function renderHome(){
  $("totalWords").textContent = WORDS.length;
  $("cnt4").textContent = WORDS.filter(function(x){ return x.lv === "4"; }).length;
  $("cnt5").textContent = WORDS.filter(function(x){ return x.lv === "5"; }).length;
  $("stLearned").textContent = WORDS.filter(isLearned).length;
  $("stWeak").textContent = WORDS.filter(isWeak).length;
  $("stSeen").textContent = WORDS.filter(isSeen).length;
  updatePoolNote();
}
function updatePoolNote(){
  readSettings();
  const n = currentPool().length;
  const weakCount = WORDS.filter(isWeak).length;
  $("weakOnly").disabled = weakCount === 0;
  $("weakDesc").textContent = weakCount === 0
    ? "아직 틀린 단어가 없어요"
    : "틀린 적이 있고 아직 다시 맞히지 못한 단어 " + weakCount + "개";
  $("typeWrap").hidden = !(settings.mode === "reading" || settings.mode === "mixed");
  $("startBtn").disabled = n === 0;
  $("poolNote").textContent = n === 0
    ? "조건에 맞는 단어가 없습니다. 품사나 조건을 바꿔 보세요."
    : "출제 대상 " + n + "개 중에서 " + (settings.count === 0 ? n : Math.min(settings.count, n)) + "문제를 냅니다.";
}

/* ---------- quiz ---------- */
function startQuiz(words){
  readSettings();
  let pool = words || shuffle(currentPool());
  if(!words && settings.count > 0) pool = pool.slice(0, settings.count);
  if(pool.length === 0) return;
  session = {
    queue: pool.map(function(word){
      const m = settings.mode === "mixed"
        ? ["jp2kr","kr2jp","reading"][Math.floor(Math.random() * 3)]
        : settings.mode;
      return makeQuestion(word, m, settings.typed);
    }),
    i: 0, score: 0, wrong: [], answered: false, source: pool
  };
  show("quiz");
  renderQuestion();
}
function renderQuestion(){
  const q = session.queue[session.i];
  session.answered = false;
  $("qn").textContent = (session.i + 1) + " / " + session.queue.length;
  $("qscore").textContent = session.score;
  $("qfill").style.width = (session.i / session.queue.length * 100) + "%";
  $("qtag").textContent = MODE_LABEL[q.mode];
  $("verdict").hidden = true;
  $("acts").hidden = true;

  if(q.mode === "jp2kr"){
    $("qread").textContent = q.word.kanji ? q.word.r : "";
    $("qword").textContent = q.word.w;
    $("qword").classList.remove("kr");
    $("qsub").textContent = "뜻을 고르세요 · " + POS_LABEL[q.word.p];
  } else if(q.mode === "kr2jp"){
    $("qread").textContent = "";
    $("qword").textContent = q.word.k;
    $("qword").classList.add("kr");
    $("qsub").textContent = "알맞은 일본어를 고르세요 · " + POS_LABEL[q.word.p];
  } else {
    $("qread").textContent = "";
    $("qword").textContent = q.word.w;
    $("qword").classList.remove("kr");
    $("qsub").textContent = q.type === "input" ? "읽기를 히라가나로 입력하세요" : "읽기를 고르세요";
  }

  const box = $("choices");
  box.innerHTML = "";
  if(q.type === "input"){
    box.hidden = true;
    $("inputrow").hidden = false;
    $("qhint").textContent = "Enter 키로 확인할 수 있어요";
    const inp = $("answerInput");
    inp.value = "";
    inp.disabled = false;
    $("checkBtn").disabled = false;
    inp.focus();
  } else {
    box.hidden = false;
    $("inputrow").hidden = true;
    $("qhint").textContent = "숫자 키 1–4로도 답할 수 있어요";
    q.choices.forEach(function(text, idx){
      const b = document.createElement("button");
      b.type = "button";
      b.className = "choice" + (q.mode === "jp2kr" ? " kr" : "");
      b.innerHTML = '<span class="key">' + (idx + 1) + '</span><span class="txt">' + esc(text) + '</span>';
      b.addEventListener("click", function(){ answerChoice(idx); });
      box.appendChild(b);
    });
  }
}
function finishAnswer(ok){
  const q = session.queue[session.i];
  session.answered = true;
  record(q.word, ok);
  if(ok) session.score++; else session.wrong.push(q.word);
  $("qscore").textContent = session.score;
  const v = $("verdict");
  v.hidden = false;
  v.className = "verdict " + (ok ? "is-ok" : "is-ng");
  $("vhead").textContent = ok ? "정답" : "오답";
  $("vw").textContent = q.word.w;
  $("vr").textContent = q.word.r;
  $("vp").textContent = POS_JP[q.word.p] + " · N" + q.word.lv;
  $("vk").textContent = q.word.k;
  $("acts").hidden = false;
  $("nextBtn").textContent = (session.i + 1 >= session.queue.length) ? "결과 보기" : "다음";
  $("nextBtn").focus();
}
function answerChoice(idx){
  if(session.answered) return;
  const q = session.queue[session.i];
  const ok = idx === q.answer;
  const btns = $("choices").querySelectorAll(".choice");
  btns.forEach(function(b, i){
    b.disabled = true;
    if(i === q.answer) b.classList.add("correct");
    else if(i === idx) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  finishAnswer(ok);
}
function answerInput(){
  if(session.answered) return;
  const q = session.queue[session.i];
  const given = toHiragana($("answerInput").value);
  if(!given) return;
  $("answerInput").disabled = true;
  $("checkBtn").disabled = true;
  finishAnswer(given === q.word.r);
}
function next(){
  if(session.i + 1 >= session.queue.length){
    showResult();
  } else {
    session.i++;
    renderQuestion();
  }
}
function showResult(){
  const total = session.queue.length;
  $("qfill").style.width = "100%";
  $("rsScore").textContent = session.score;
  $("rsOf").textContent = " / " + total;
  const pct = Math.round(session.score / total * 100);
  $("rsPct").textContent = pct + "% 정답" + (pct === 100 ? " · 완벽해요!" : (pct >= 80 ? " · 좋아요!" : ""));
  const wrong = session.wrong;
  $("reviewBox").hidden = wrong.length === 0;
  $("againWrong").hidden = wrong.length === 0;
  $("reviewHead").textContent = "틀린 단어 " + wrong.length + "개";
  $("rlist").innerHTML = wrong.map(function(x){
    return '<div class="ritem"><span class="w">' + esc(x.w) + '</span><span class="r">' + esc(x.r) +
      '</span><span class="pos">' + POS_JP[x.p] + '</span><span class="k kr">' + esc(x.k) + '</span></div>';
  }).join("");
  show("result");
  renderHome();
}

/* ---------- word list ---------- */
let listFilter = "all";
function renderChips(){
  const chips = $("listChips");
  chips.innerHTML = "";
  const defs = [["all","전체"]].concat(Object.keys(POS_LABEL).map(function(k){ return [k, POS_LABEL[k]]; }))
    .concat([["lv4","N4"],["lv5","N5"],["weak","약한 단어"],["learned","외운 단어"]]);
  defs.forEach(function(d){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip kr";
    b.textContent = d[1];
    b.setAttribute("aria-pressed", listFilter === d[0] ? "true" : "false");
    b.addEventListener("click", function(){ listFilter = d[0]; renderChips(); renderList(); });
    chips.appendChild(b);
  });
}
function renderList(){
  const q = $("search").value.trim().toLowerCase();
  const qh = toHiragana($("search").value);
  const rows = WORDS.filter(function(x){
    if(listFilter === "weak") return isWeak(x);
    if(listFilter === "learned") return isLearned(x);
    if(listFilter === "lv4") return x.lv === "4";
    if(listFilter === "lv5") return x.lv === "5";
    if(listFilter !== "all" && x.p !== listFilter) return false;
    return true;
  }).filter(function(x){
    if(!q) return true;
    return x.w.indexOf(q) >= 0 || x.r.indexOf(qh) >= 0 || x.k.toLowerCase().indexOf(q) >= 0;
  });
  $("listCount").textContent = rows.length + "개";
  $("wlist").innerHTML = rows.map(function(x){
    const cls = isLearned(x) ? "learned" : (isWeak(x) ? "weak" : "");
    return '<div class="wrow"><span class="dot ' + cls + '"></span><span class="main"><span class="w">' +
      esc(x.w) + '</span><span class="r">' + esc(x.r) + '</span><span class="pos">' + POS_JP[x.p] + '</span><span class="pos">N' + x.lv +
      '</span></span><span class="k">' + esc(x.k) + '</span></div>';
  }).join("");
}

/* ---------- wiring ---------- */
function buildPosOptions(){
  const box = $("posOpts");
  const defs = [["all","전체"]].concat(Object.keys(POS_LABEL).map(function(k){ return [k, POS_LABEL[k]]; }));
  box.innerHTML = defs.map(function(d, i){
    return '<label class="opt compact"><input type="radio" name="pos" value="' + d[0] + '"' +
      (i === 0 ? " checked" : "") + '><span class="t">' + d[1] + '</span></label>';
  }).join("");
}
buildPosOptions();
loadStats();
renderHome();
renderChips();
renderList();

document.querySelectorAll('input[name="mode"],input[name="pos"],input[name="lv"],input[name="count"]').forEach(function(el){
  el.addEventListener("change", updatePoolNote);
});
$("weakOnly").addEventListener("change", updatePoolNote);
$("typeMode").addEventListener("change", updatePoolNote);
$("startBtn").addEventListener("click", function(){ startQuiz(null); });
$("nextBtn").addEventListener("click", next);
$("checkBtn").addEventListener("click", answerInput);
$("answerInput").addEventListener("keydown", function(e){ if(e.key === "Enter") answerInput(); });
$("quitBtn").addEventListener("click", function(){ renderHome(); show("home"); });
$("toHome").addEventListener("click", function(){ renderHome(); show("home"); });
$("againSame").addEventListener("click", function(){ startQuiz(null); });
$("againWrong").addEventListener("click", function(){ startQuiz(shuffle(session.wrong)); });
$("navList").addEventListener("click", function(){ renderChips(); renderList(); show("list"); });
$("navHome").addEventListener("click", function(){ renderHome(); show("home"); });
$("search").addEventListener("input", renderList);
$("resetBtn").addEventListener("click", function(){
  stats = {};
  saveStats();
  renderHome();
  renderList();
});
document.addEventListener("keydown", function(e){
  if($("quiz").hidden) return;
  if(!session) return;
  if(session.answered && (e.key === "Enter" || e.key === " ")){
    e.preventDefault();
    next();
    return;
  }
  if(!session.answered && /^[1-4]$/.test(e.key)){
    const q = session.queue[session.i];
    if(q.type === "choice" && q.choices.length >= parseInt(e.key, 10)){
      answerChoice(parseInt(e.key, 10) - 1);
    }
  }
});
</script>
